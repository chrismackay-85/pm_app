name: CI

on:
  push:
    branches: [ main, master, '**/ci' ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: cursor_kanban/frontend

      - name: Run ESLint
        run: npm run lint
        working-directory: cursor_kanban/frontend

      - name: Run unit tests with coverage
        run: npm run test -- --coverage
        working-directory: cursor_kanban/frontend

      - name: Upload Vitest coverage
        uses: actions/upload-artifact@v4
        with:
          name: vitest-coverage
          path: cursor_kanban/frontend/coverage

  e2e:
    needs: lint-and-test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        working-directory: cursor_kanban/frontend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        working-directory: cursor_kanban/frontend

      - name: Start dev server
        run: npm run dev &
        working-directory: cursor_kanban/frontend

      - name: Wait for server
        run: |
          n=0
          until curl -sSf http://localhost:3000 || [ $n -ge 30 ]; do
            n=$((n+1))
            sleep 1
          done

      - name: Run Playwright tests
        run: npm run test:e2e
        working-directory: cursor_kanban/frontend

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            cursor_kanban/frontend/test-results
            cursor_kanban/frontend/playwright-report
